<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
</head>
<body>

<h1 id="myText">Hello World</h1>

<button onclick="changeText()">Click Me</button>

<script>
function changeText() {
    document.getElementById("myText").textContent = "Text Changed!";
}
console.log("Text changed sucessfully");
</script>

</body>
</html>
